<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Imóveis</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Portal de imóveis para comprar, vender e alugar." />
        <meta name="theme-color" content="#1c3c6d" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <script>
            /* evita "piscar" claro antes do tema carregar */
            try {
                var t = JSON.parse(localStorage.getItem('imoveis.tema') || 'null');
                var m = t && t.mode ? t.mode : 'auto';
                if (m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('app-dark');
            } catch (e) {}
        </script>
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
