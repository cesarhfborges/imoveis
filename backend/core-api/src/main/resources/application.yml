# -----------------------------------------------------------------------------
# Configuração base = PRODUÇÃO. Sempre carregada.
# Valores sensíveis vêm de variáveis de ambiente.
#
# Perfil "dev" (application-dev.yml): carregado DEPOIS deste arquivo e só
# sobrescreve o necessário. Sem o perfil dev, vale apenas este arquivo.
#
# Como ativar o dev:
#   mvn -pl core-api -am spring-boot:run       (perfil Maven "dev", padrão)
#   java -jar imoveis.war --spring.profiles.active=dev
#   SPRING_PROFILES_ACTIVE=dev
#
# Em produção (Coolify) as variáveis vêm do docker-compose.yml da raiz, que liga
# as variáveis mágicas do Coolify (SERVICE_URL_*, SERVICE_PASSWORD_*...) a estas.
# -----------------------------------------------------------------------------
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      tracking-modes: cookie
      cookie:
        name: IMOVEIS_SESSION
        http-only: true
        secure: true
        same-site: strict
        path: /
  compression:
    enabled: true

spring:
  application:
    name: imoveis
  jackson:
    # fuso usado ao formatar datas na API; o fuso da JVM vem da variável TZ do contêiner
    time-zone: ${TZ:America/Sao_Paulo}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imoveis}
    username: ${DB_USER:imoveis}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # fuso em que as datas são gravadas no banco (manter UTC)
          time_zone: ${DB_TIME_ZONE:UTC}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # tamanho de cada arquivo e da requisição inteira (o nginx de entrada usa o mesmo limite)
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

app:
  security:
    # Origens do front que podem usar a API de sessão (/app/**). Separe por vírgula.
    frontend-origins: ${APP_FRONTEND_ORIGINS:https://imoveis.chfb.com.br}
    # Origens liberadas no CORS da API aberta (/api/v1/**).
    api-cors-origins: ${APP_API_CORS_ORIGINS:*}
  uploads:
    dir: ${APP_UPLOADS_DIR:/var/lib/imoveis/uploads}
    max-bytes: ${UPLOAD_MAX_FILE_SIZE:5MB}
  seed:
    demo: false
  # Tempo real (WebSocket): servidor Soketi, protocolo Pusher. Desligado, o front segue por consulta periódica.
  realtime:
    ativo: ${APP_REALTIME_ATIVO:false}
    app-id: ${APP_REALTIME_APP_ID:imoveis}
    key: ${APP_REALTIME_KEY:}
    secret: ${APP_REALTIME_SECRET:}
    # API HTTP do Soketi vista pelo backend (rede interna)
    url: ${APP_REALTIME_URL:http://localhost:6001}
    # como o navegador conecta: host vazio = o mesmo domínio do site (ex.: proxy reverso em /ws)
    cliente:
      ws-host: ${APP_REALTIME_WS_HOST:}
      ws-port: ${APP_REALTIME_WS_PORT:80}
      wss-port: ${APP_REALTIME_WSS_PORT:443}
      ws-path: ${APP_REALTIME_WS_PATH:}
      force-tls: ${APP_REALTIME_FORCE_TLS:true}
  bootstrap:
    admin-nome: ${APP_ADMIN_NOME:Administrador}
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-senha: ${APP_ADMIN_SENHA:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    br.com.chfb: ${LOG_LEVEL_APP:INFO}

# Saúde para o health check do contêiner: GET /actuator/health (só na rede interna; o nginx não expõe /actuator).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
