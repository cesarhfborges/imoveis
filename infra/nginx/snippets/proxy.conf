# Cabeçalhos repassados a todos os serviços. Fica num include porque o nginx NÃO herda
# proxy_set_header de cima quando o location define algum (caso do /ws/).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $xff;
proxy_set_header X-Forwarded-Proto $proto_original;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $porta_original;
